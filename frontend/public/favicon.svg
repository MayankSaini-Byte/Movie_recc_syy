<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Film reel background -->
  <circle cx="50" cy="50" r="45" fill="#FF6B6B"/>
  
  <!-- Film reel circles -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="2"/>
  
  <!-- Film strip holes -->
  <rect x="10" y="48" width="6" height="4" fill="#fff"/>
  <rect x="84" y="48" width="6" height="4" fill="#fff"/>
  <rect x="10" y="58" width="6" height="4" fill="#fff"/>
  <rect x="84" y="58" width="6" height="4" fill="#fff"/>
  
  <!-- Play button in center -->
  <polygon points="40,35 40,65 65,50" fill="#fff"/>
  
  <!-- Center circle -->
  <circle cx="50" cy="50" r="5" fill="#FF6B6B"/>
</svg>